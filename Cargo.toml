[package]
name = "znepro-sdk"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Official hardware-calibration extractors and job payload helpers for the ZNEPro API."
publish = false
readme = "README.md"

[lib]
name = "znepro_sdk"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
pyo3 = { version = "0.22", features = ["abi3-py310"], optional = true }

[dev-dependencies]

# Release builds strip symbols for published wheels.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
